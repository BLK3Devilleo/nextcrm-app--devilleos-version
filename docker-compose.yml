services:
  # --- MinIO Object Storage ---
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nextcrm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio_data:/data
    networks:
      - nextcrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Inngest Dev Server ---
  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: inngest dev -u http://app:3000/api/inngest
    networks:
      - nextcrm

  # --- NextCRM Application ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3030}:3000"
    environment:
      # Supabase / External PostgreSQL Database
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-postgres}

      # Auth
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://ernakcrm.filocentraldemando.site}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}

      # Email (SMTP / Google Workspace or Resend)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      # MinIO — values come from the same env vars as the minio service.
      NEXT_PUBLIC_MINIO_ENDPOINT: http://minio:9000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PORT: "9000"
      MINIO_BUCKET: nextcrm
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-nextcrm}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme}

      # Inngest
      INNGEST_DEV: "1"
      INNGEST_ID: nextcrm
      INNGEST_APP_NAME: NextCRM
      INNGEST_EVENT_KEY: local
      INNGEST_SIGNING_KEY: ""
      INNGEST_BASE_URL: http://inngest:8288

      # App
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NextCRM}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ernakcrm.filocentraldemando.site}

      # Initial admin account
      TEST_USER_EMAIL: ${ADMIN_EMAIL:-ernakproyectos@gmail.com}

      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder-replace-to-enable-ai}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder_replace_to_enable_email}
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
    depends_on:
      minio:
        condition: service_healthy
      inngest:
        condition: service_started
    networks:
      - nextcrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  minio_data:

networks:
  nextcrm:
    driver: bridge
